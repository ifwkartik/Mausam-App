<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mausam — home</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- Added Noto Sans & Noto Serif for complete Indic script coverage -->
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600&family=Noto+Sans:wght@400;500;600&family=Noto+Serif:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/tabler-icons/2.44.0/iconfont/tabler-icons.min.css">
<style>
  :root{
    --ink:#152135; --ink-soft:#4a5670; --ink-mute:#8792a3;
    --mist:#eef2f1; --panel:#ffffff; --hairline:#dfe4e2;
    --petrol:#1d3a4a; --petrol-soft:#3c5c6c;
    --marigold:#e08c2b; --marigold-deep:#8a5314; --marigold-bg:#fbeed9;
    --teal:#1c7a67; --teal-bg:#e2f1ec;
    --rose:#b8493f; --rose-bg:#f8e6e2;
    --radius-lg:20px; --radius-md:14px;
    --font-sans: 'Inter', 'Noto Sans', sans-serif;
    --font-serif: 'Fraunces', 'Noto Serif', serif;
  }
  *{box-sizing:border-box;}
  body{margin:0; background:#d9dfda; font-family:var(--font-sans); color:var(--ink);
    display:flex; justify-content:center; padding:32px 12px; -webkit-font-smoothing:antialiased;}
  .phone{width:390px; max-width:100%; background:var(--mist); border-radius:34px; overflow:hidden;
    box-shadow:0 1px 2px rgba(21,33,53,0.06), 0 12px 32px rgba(21,33,53,0.14); position:relative;}
  .scroll{height:800px; overflow-y:auto; scrollbar-width:none; padding:20px 18px 40px;}
  .scroll::-webkit-scrollbar{display:none;}

  .topline{display:flex; align-items:center; justify-content:space-between; margin-bottom:14px; gap:8px;}
  .selectors-wrap{display:flex; align-items:center; gap:8px; flex-wrap:wrap;}
  .place-select, .lang-select{
    appearance:none; -webkit-appearance:none; border:none; background:transparent;
    font-family:var(--font-sans); font-size:13px; color:var(--ink-soft); font-weight:500;
    padding:0; display:flex; align-items:center; gap:4px; cursor:pointer; outline:none;
  }
  .lang-picker{
    background:var(--panel); border:1px solid var(--hairline); border-radius:100px;
    padding:3px 8px; display:inline-flex; align-items:center; gap:4px;
  }
  .place-wrap{display:flex; align-items:center; gap:5px; cursor:pointer; -webkit-tap-highlight-color:transparent;}
  .place-wrap i, .lang-picker i{font-size:14px; color:var(--petrol-soft);}
  .place-wrap i.chev, .lang-picker i.chev{font-size:11px; margin-left:-1px; color:var(--ink-mute);}
  .place-wrap #citySelectLabel{max-width:150px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}

  /* ---------- City picker sheet ---------- */
  .city-picker-title{font-family:var(--font-serif); font-size:18px; font-weight:500; margin:2px 0 14px;}
  .city-search-row{display:flex; align-items:center; gap:8px; background:var(--mist);
    border:1px solid var(--hairline); border-radius:var(--radius-md); padding:11px 13px; margin-bottom:14px;}
  .city-search-row i{font-size:16px; color:var(--ink-mute); flex-shrink:0;}
  .city-search-row input{border:none; outline:none; background:transparent; font-family:var(--font-sans);
    font-size:14px; color:var(--ink); flex:1; min-width:0;}
  .city-search-row input::placeholder{color:var(--ink-mute);}
  .city-picker-sublabel{font-size:12px; color:var(--ink-mute); font-weight:500; margin:0 0 8px 2px;}
  .city-results:not(:empty){margin-bottom:16px; background:var(--panel); border:1px solid var(--hairline);
    border-radius:var(--radius-md); overflow:hidden; max-height:260px; overflow-y:auto;}
  .city-result{padding:11px 13px; cursor:pointer; border-bottom:1px solid var(--hairline); display:flex; align-items:center; gap:10px;}
  .city-result:last-child{border-bottom:none;}
  .city-result:active{background:var(--mist);}
  .city-result i{font-size:15px; color:var(--petrol-soft); flex-shrink:0;}
  .cr-name{font-size:13.5px; font-weight:500; margin:0;}
  .cr-sub{font-size:11.5px; color:var(--ink-mute); margin:2px 0 0;}
  .city-result-loading{padding:12px 13px; font-size:12.5px; color:var(--ink-mute);}
  .popular-city-grid{display:flex; flex-wrap:wrap; gap:8px; max-height:280px; overflow-y:auto;}
  .popular-city-chip{font-size:12.5px; font-weight:500; padding:8px 13px; border-radius:100px;
    border:1px solid var(--hairline); background:var(--panel); color:var(--ink-soft); cursor:pointer;
    -webkit-tap-highlight-color:transparent; user-select:none; white-space:nowrap;}
  .popular-city-chip:active{transform:scale(0.96); background:var(--mist);}
  .popular-city-chip.current{background:var(--petrol); border-color:var(--petrol); color:#fff;}
  .greeting{font-family:var(--font-serif); font-size:21px; font-weight:500; margin:3px 0 0; letter-spacing:-0.01em;}
  .greeting-row{display:flex; align-items:center; gap:7px; cursor:pointer; -webkit-tap-highlight-color:transparent; width:fit-content;}
  .greeting-edit-ic{font-size:13px; color:var(--ink-mute); margin-top:3px;}
  .avatar{cursor:pointer; -webkit-tap-highlight-color:transparent;}
  .avatar{width:38px; height:38px; border-radius:50%; background:var(--petrol); color:#fff;
    display:flex; align-items:center; justify-content:center; font-family:var(--font-serif);
    font-size:15px; font-weight:500; flex-shrink:0;}

  .chiprow{display:flex; gap:7px; overflow-x:auto; margin-bottom:16px; scrollbar-width:none; padding-bottom:2px;}
  .chiprow::-webkit-scrollbar{display:none;}
  .chip{flex-shrink:0; font-size:12.5px; font-weight:500; padding:7px 13px; border-radius:100px;
    border:1px solid var(--hairline); background:var(--panel); color:var(--ink-soft); cursor:pointer;
    transition:background .18s ease, color .18s ease, border-color .18s ease, transform .12s ease;
    -webkit-tap-highlight-color:transparent; user-select:none; white-space:nowrap;}
  .chip:active{transform:scale(0.96);}
  .chip.on{background:var(--petrol); border-color:var(--petrol); color:#fff;}

  .hero{background:var(--petrol); border-radius:var(--radius-lg); padding:22px 22px 20px; color:#fff;
    margin-bottom:0; position:relative; overflow:hidden; min-height:150px; cursor:pointer;
    -webkit-tap-highlight-color:transparent;}
  .hero:active{background:#1a3441;}
  .hero-chev{position:absolute; right:16px; bottom:14px; font-size:14px; color:rgba(255,255,255,0.55);
    transition:transform .3s ease;}
  .hero.expanded .hero-chev{transform:rotate(180deg);}
  .hero-top{display:flex; align-items:flex-start; justify-content:space-between;}
  .temp{font-family:var(--font-serif); font-size:56px; font-weight:400; line-height:1; letter-spacing:-0.02em;}
  .cond{font-size:13.5px; color:#c7d6d3; margin-top:6px;}
  .hero-icon{font-size:40px; color:#eecf8e; margin-top:2px;}
  .sunline{display:flex; gap:16px; margin-top:18px; padding-top:14px; border-top:1px solid rgba(255,255,255,0.14);
    font-size:12.5px; color:#c7d6d3; flex-wrap:wrap;}
  .sunline span{display:flex; align-items:center; gap:5px;}
  .sunline i{font-size:14px; color:#eecf8e;}

  .source-line{font-size:11px; color:var(--ink-mute); margin:0 0 18px 2px; display:flex; align-items:center; gap:6px;}
  .source-line .dot{width:5px; height:5px; border-radius:50%; background:var(--teal); flex-shrink:0;
    animation:dotLive 2.2s ease-in-out infinite;}
  .source-line.err .dot{background:var(--rose); animation:none;}
  @keyframes dotLive{0%,100%{opacity:1;}50%{opacity:.3;}}
  .source-line button{
    border:none; background:none; color:var(--petrol-soft); font-size:11px; font-weight:500;
    text-decoration:underline; cursor:pointer; padding:0; font-family:var(--font-sans);
  }

  .alert{display:flex; align-items:center; gap:10px; background:var(--marigold-bg); border-radius:var(--radius-md);
    padding:12px 14px; margin-bottom:20px; font-size:13px; color:var(--marigold-deep);
    opacity:0; transform:translateY(-6px); animation:slideIn .5s ease .15s forwards;}
  @keyframes slideIn{to{opacity:1; transform:translateY(0);}}
  .alert i{font-size:16px; flex-shrink:0;}

  .section{margin-bottom:22px;}
  .section-label{font-size:12.5px; color:var(--ink-mute); margin:0 0 9px 2px; font-weight:500; display:flex; align-items:center; justify-content:space-between;}
  .tag-sample{font-size:10px; color:var(--ink-mute); border:1px solid var(--hairline); border-radius:100px; padding:2px 7px; font-weight:500;}

  #dynamic{transition:opacity .22s ease, transform .22s ease;}
  #dynamic.fading{opacity:0; transform:translateY(4px);}

  .row-card{display:flex; align-items:center; gap:13px; background:var(--panel); border-radius:var(--radius-md);
    padding:14px 15px; border:1px solid var(--hairline);}
  .row-card i.lead{font-size:20px; color:var(--petrol-soft); flex-shrink:0;}
  .row-card .rc-title{font-size:14px; font-weight:500; margin:0;}
  .row-card .rc-sub{font-size:12.5px; color:var(--ink-mute); margin:2px 0 0;}
  .row-card .rc-value{margin-left:auto; text-align:right; font-size:14px; font-weight:500; flex-shrink:0;}

  .pair{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
  .stat-tile{background:var(--panel); border:1px solid var(--hairline); border-radius:var(--radius-md); padding:13px 14px;}
  .stat-tile i{font-size:17px; color:var(--petrol-soft);}
  .stat-tile .st-label{font-size:11.5px; color:var(--ink-mute); margin:9px 0 0;}
  .stat-tile .st-value{font-size:17px; font-weight:500; margin:2px 0 0; font-family:var(--font-serif);}

  .triple{display:grid; grid-template-columns:1fr 1fr 1fr; gap:8px;}
  .mini-tile{background:var(--panel); border:1px solid var(--hairline); border-radius:12px; padding:11px 10px;}
  .mini-tile .mt-label{font-size:11px; color:var(--ink-mute); margin:0;}
  .mini-tile .mt-value{font-size:14px; font-weight:600; margin:5px 0 0;}
  .mt-warn{color:var(--marigold-deep);} .mt-danger{color:var(--rose);} .mt-good{color:var(--teal);}

  .stack{display:flex; flex-direction:column; gap:9px;}
  .empty-note, .load-note{font-size:13px; color:var(--ink-mute); text-align:center; padding:18px 10px;
    background:var(--panel); border:1px dashed var(--hairline); border-radius:var(--radius-md);}
  .err-note{font-size:12.5px; color:var(--rose); background:var(--rose-bg); border-radius:var(--radius-md);
    padding:12px 14px;}

  .discover-strip{display:flex; gap:10px; overflow-x:auto; scrollbar-width:none; padding-bottom:2px;}
  .discover-strip::-webkit-scrollbar{display:none;}
  .disc-card{flex-shrink:0; width:152px; background:var(--panel); border:1px dashed var(--hairline);
    border-radius:var(--radius-md); padding:13px;}
  .disc-card i{font-size:18px; color:var(--ink-mute);}
  .disc-card p{font-size:12.5px; line-height:1.4; margin:9px 0 0; color:var(--ink-soft);}

  .farm-search-wrap{margin-bottom:12px;}
  .farm-search-row{display:flex; align-items:center; gap:8px; background:var(--panel);
    border:1px solid var(--hairline); border-radius:var(--radius-md); padding:10px 12px;}
  .farm-search-row i{font-size:15px; color:var(--ink-mute); flex-shrink:0;}
  .farm-search-row input{border:none; outline:none; background:transparent; font-family:var(--font-sans);
    font-size:13.5px; color:var(--ink); flex:1; min-width:0;}
  .farm-search-row input::placeholder{color:var(--ink-mute);}
  .farm-results:not(:empty){margin-top:6px; background:var(--panel); border:1px solid var(--hairline);
    border-radius:var(--radius-md); overflow:hidden;}
  .farm-result{padding:10px 13px; cursor:pointer; border-bottom:1px solid var(--hairline);}
  .farm-result:last-child{border-bottom:none;}
  .farm-result:active{background:var(--mist);}
  .fr-name{font-size:13.5px; font-weight:500; margin:0;}
  .fr-sub{font-size:11.5px; color:var(--ink-mute); margin:2px 0 0;}
  .farm-result-loading{padding:11px 13px; font-size:12.5px; color:var(--ink-mute);}
  .farm-location-line{display:flex; align-items:center; gap:6px; font-size:12.5px; color:var(--ink-soft); margin:2px 2px 10px;}
  .farm-location-line i{font-size:14px; color:var(--petrol-soft); flex-shrink:0;}

  /* ---------- launch splash ---------- */
  .splash{
    position:absolute; inset:0; z-index:30; overflow:hidden;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    transition:transform .7s cubic-bezier(.65,0,.35,1);
  }
  .splash.leaving{transform:translateY(-100%);}
  .sky{position:absolute; inset:0;}
  .sky-a{position:absolute; inset:0; background:linear-gradient(180deg,#f3d9a6 0%,#e6a15c 32%,#4a5c6a 78%,var(--petrol) 100%);}
  .sky-b{position:absolute; inset:0; background:var(--petrol); opacity:0; transition:opacity 1.1s ease;}
  .cloud{position:absolute; opacity:.5; filter:blur(.5px);}
  .cloud svg{display:block;}
  .cloud-1{top:26%; left:-30%; width:150px; animation:driftRight 26s linear infinite;}
  .cloud-2{top:40%; left:-45%; width:110px; opacity:.35; animation:driftRight 34s linear infinite; animation-delay:-8s;}
  @keyframes driftRight{to{transform:translateX(340px);}}

  .sun-wrap{position:absolute; left:50%; top:60%; width:64px; height:64px; margin:-32px 0 0 -32px;
    transition:top 1.4s cubic-bezier(.22,1,.36,1);}
  .sun-glow{position:absolute; inset:-22px; border-radius:50%;
    background:radial-gradient(circle, rgba(232,167,73,0.55) 0%, rgba(232,167,73,0) 70%);}
  .sun-core{position:absolute; inset:0; border-radius:50%; background:#f0b95f;
    box-shadow:0 0 0 1px rgba(255,255,255,0.25) inset;}

  .splash-foot{position:relative; z-index:2; display:flex; flex-direction:column; align-items:center; margin-top:112px;}
  .splash-word-wrap{overflow:hidden;}
  .splash-word{
    font-family:var(--font-serif); font-size:34px; font-weight:500; color:#fff;
    margin:0; letter-spacing:-0.01em; clip-path:inset(0 100% 0 0);
    animation:wipeReveal .85s cubic-bezier(.22,1,.36,1) .25s forwards;
  }
  @keyframes wipeReveal{to{clip-path:inset(0 0 0 0);}}
  .splash-tag{font-size:13px; color:#dbe6de; margin:7px 0 22px; opacity:0; animation:fadeUp .6s ease .55s forwards;}
  @keyframes fadeUp{from{opacity:0; transform:translateY(5px);}to{opacity:1; transform:translateY(0);}}
  .splash-bar-track{width:120px; height:3px; border-radius:3px; background:rgba(255,255,255,0.18); overflow:hidden;}
  .splash-bar-fill{height:100%; width:8%; background:var(--marigold); border-radius:3px; transition:width .5s cubic-bezier(.22,1,.36,1);}
  .splash-label{font-size:11.5px; color:#c7d6d3; margin-top:10px; min-height:14px; transition:opacity .18s ease;}

  .scroll{opacity:0; transform:translateY(14px) scale(.985); transition:opacity .55s ease, transform .55s ease;}
  .scroll.in{opacity:1; transform:translateY(0) scale(1);}

  /* ---------- hero expand (pressure / dew point / cloud / gusts) ---------- */
  .hero-expand{max-height:0; overflow:hidden; background:#16303d; border-radius:0 0 var(--radius-lg) var(--radius-lg);
    margin:-2px 0 12px; transition:max-height .32s cubic-bezier(.22,1,.36,1);}
  .hero-expand.open{max-height:140px;}
  .he-grid{display:grid; grid-template-columns:1fr 1fr 1fr 1fr; gap:6px; padding:16px 14px;}
  .he-tile{text-align:center;}
  .he-tile i{font-size:16px; color:#8fb2b6;}
  .he-label{font-size:10px; color:#a7bcc0; margin:6px 0 0; line-height:1.2;}
  .he-value{font-size:13px; font-weight:600; color:#fff; margin:2px 0 0; font-family:var(--font-serif);}

  /* ---------- live clock + refresh ---------- */
  .live-clock{font-size:11px; color:var(--ink-mute); font-variant-numeric:tabular-nums; margin:1px 0 0 2px;}
  .refresh-btn{border:none; background:none; padding:2px; margin-left:auto; cursor:pointer;
    color:var(--petrol-soft); font-size:13px; display:inline-flex; -webkit-tap-highlight-color:transparent;}
  .refresh-btn.spinning i{animation:spin .7s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}
  .source-line{justify-content:space-between;}

  /* ---------- hourly strip + nowcast ---------- */
  .hourly-section{margin-bottom:22px;}
  .nowcast{background:var(--panel); border:1px solid var(--hairline); border-radius:var(--radius-md);
    padding:12px 14px; margin-bottom:10px;}
  .nc-summary{font-size:12.5px; color:var(--ink-soft); margin:0 0 9px; display:flex; align-items:center; gap:6px;}
  .nc-summary i{font-size:14px; color:var(--petrol-soft);}
  .nc-bars{display:flex; align-items:flex-end; gap:4px; height:30px;}
  .nc-bar{flex:1; background:var(--petrol-soft); border-radius:2px 2px 0 0; min-height:3px;
    transition:height .4s ease;}
  .hourly-strip{display:flex; gap:8px; overflow-x:auto; scrollbar-width:none; padding:2px 2px 4px;}
  .hourly-strip::-webkit-scrollbar{display:none;}
  .hour-card{flex-shrink:0; width:56px; background:var(--panel); border:1px solid var(--hairline);
    border-radius:12px; padding:10px 4px 9px; text-align:center; cursor:pointer;
    transition:transform .12s ease, border-color .15s ease; -webkit-tap-highlight-color:transparent;}
  .hour-card:active{transform:scale(0.94); border-color:var(--petrol-soft);}
  .hc-time{font-size:11px; color:var(--ink-mute); margin:0; font-weight:500;}
  .hc-icon{font-size:18px; color:var(--petrol-soft); margin:7px 0;}
  .hc-temp{font-size:13.5px; font-weight:600; margin:0;}
  .hc-pop{font-size:10px; color:var(--teal); margin:4px 0 0; min-height:12px;}
  .hc-pop-on{font-weight:600;}

  /* ---------- 7-day forecast ---------- */
  .daily-list{background:var(--panel); border:1px solid var(--hairline); border-radius:var(--radius-md); overflow:hidden;}
  .day-row{border-bottom:1px solid var(--hairline); cursor:pointer; -webkit-tap-highlight-color:transparent;}
  .day-row:last-child{border-bottom:none;}
  .day-row-main{display:flex; align-items:center; gap:10px; padding:12px 14px;}
  .dr-day{font-size:13.5px; font-weight:500; margin:0; width:64px; flex-shrink:0;}
  .dr-icon{font-size:17px; color:var(--petrol-soft); flex-shrink:0;}
  .dr-pop{font-size:11px; color:var(--teal); margin:0; width:32px; flex-shrink:0;}
  .dr-temp{margin:0 0 0 auto; font-size:13.5px; display:flex; gap:6px;}
  .dr-max{font-weight:600;}
  .dr-min{color:var(--ink-mute);}
  .dr-chev{font-size:13px; color:var(--ink-mute); transition:transform .25s ease; flex-shrink:0;}
  .day-row.open .dr-chev{transform:rotate(180deg);}
  .day-row-detail{max-height:0; overflow:hidden; transition:max-height .3s ease;}
  .day-row.open .day-row-detail{max-height:100px;}
  .dr-detail-grid{display:grid; grid-template-columns:1fr 1fr 1fr 1fr; gap:6px; padding:0 14px 14px; text-align:center;}
  .dr-detail-grid i{font-size:14px; color:var(--petrol-soft);}
  .dr-detail-grid .sg-value{font-size:11.5px; margin:3px 0 0; color:var(--ink-soft);}

  /* ---------- bottom sheet (hour detail) ---------- */
  .sheet-overlay{position:absolute; inset:0; z-index:40; background:rgba(21,33,53,0.32);
    opacity:0; pointer-events:none; transition:opacity .25s ease; display:flex; align-items:flex-end;}
  .sheet-overlay.open{opacity:1; pointer-events:auto;}
  .sheet{width:100%; background:var(--panel); border-radius:22px 22px 0 0; padding:10px 22px 26px;
    transform:translateY(100%); transition:transform .3s cubic-bezier(.22,1,.36,1); text-align:center;}
  .sheet-overlay.open .sheet{transform:translateY(0);}
  .sheet-handle{width:36px; height:4px; border-radius:3px; background:var(--hairline); margin:0 auto 14px;}
  .sheet-time{font-size:12.5px; color:var(--ink-mute); margin:0; font-weight:500;}
  .sheet-main{display:flex; align-items:center; justify-content:center; gap:10px; margin:8px 0 2px;}
  .sheet-main i{font-size:30px; color:var(--petrol-soft);}
  .sheet-temp{font-family:var(--font-serif); font-size:38px; font-weight:500;}
  .sheet-cond{font-size:13px; color:var(--ink-soft); margin:0 0 16px;}
  .sheet-grid{display:grid; grid-template-columns:1fr 1fr 1fr 1fr; gap:8px;}
  .sheet-grid .sg-label{font-size:10.5px; color:var(--ink-mute); margin:0;}
  .sheet-grid .sg-value{font-size:14px; font-weight:600; margin:4px 0 0;}
  .sheet.left-align{text-align:left;}
  .sheet-input-row{display:flex; align-items:center; gap:8px; background:var(--mist);
    border:1px solid var(--hairline); border-radius:var(--radius-md); padding:11px 13px; margin-bottom:16px;}
  .sheet-input-row i{font-size:16px; color:var(--ink-mute); flex-shrink:0;}
  .sheet-input-row input{border:none; outline:none; background:transparent; font-family:var(--font-sans);
    font-size:14px; color:var(--ink); flex:1; min-width:0;}
  .sheet-input-row input::placeholder{color:var(--ink-mute);}
  .sheet-primary-btn{width:100%; border:none; background:var(--petrol); color:#fff; font-family:var(--font-sans);
    font-size:14px; font-weight:600; padding:12px; border-radius:var(--radius-md); cursor:pointer;
    -webkit-tap-highlight-color:transparent;}

function weatherInfo(code){
  const iconMap = {
    0:'ti-sun', 1:'ti-sun', 2:'ti-cloud', 3:'ti-cloud',
    45:'ti-cloud-fog', 48:'ti-cloud-fog', 51:'ti-cloud-drizzle', 53:'ti-cloud-drizzle',
    55:'ti-cloud-drizzle', 61:'ti-cloud-rain', 63:'ti-cloud-rain', 65:'ti-cloud-rain',
    71:'ti-cloud-snow', 73:'ti-cloud-snow', 75:'ti-cloud-snow', 80:'ti-cloud-rain',
    81:'ti-cloud-rain', 82:'ti-cloud-rain', 95:'ti-cloud-storm', 96:'ti-cloud-storm', 99:'ti-cloud-storm'
  };
  const text = t(`weather.${code}`) || t('weather.fallback') || 'Partly cloudy';
  return [iconMap[code] || 'ti-cloud', text];
}

function aqiCategory(v){
  if(v==null) return {text:'—', cls:''};
  if(v<=50) return {text: t('aqi.good'), cls:'mt-good'};
  if(v<=100) return {text: t('aqi.mod'), cls:'mt-warn'};
  if(v<=150) return {text: t('aqi.sens'), cls:'mt-warn'};
  if(v<=200) return {text: t('aqi.unh'), cls:'mt-danger'};
  if(v<=300) return {text: t('aqi.vUnh'), cls:'mt-danger'};
  return {text: t('aqi.haz'), cls:'mt-danger'};
}

function uvCategory(v){
  if(v==null) return {text:'—', cls:''};
  if(v<=2) return {text: t('uv.low'), cls:'mt-good'};
  if(v<=5) return {text: t('uv.mod'), cls:'mt-warn'};
  if(v<=7) return {text: t('uv.high'), cls:'mt-warn'};
  if(v<=10) return {text: t('uv.vHigh'), cls:'mt-danger'};
  return {text: t('uv.ext'), cls:'mt-danger'};
}

function comfortIndex(tC, rh){
  if(tC==null || rh==null) return null;
  const T = tC*9/5+32, R = rh;
  let hiF = -42.379 + 2.04901523*T + 10.14333127*R - 0.22475541*T*R - 0.00683783*T*T
    - 0.05481717*R*R + 0.00122874*T*T*R + 0.00085282*T*R*R - 0.00000199*T*T*R*R;
  if(T < 80) hiF = T;
  const hiC = (hiF-32)*5/9;
  let label, cls;
  if(hiC < 27){label=t('comfort.comfortable'); cls='mt-good';}
  else if(hiC < 32){label=t('comfort.warm'); cls='mt-warn';}
  else if(hiC < 39){label=t('comfort.hot'); cls='mt-danger';}
  else {label=t('comfort.vHot'); cls='mt-danger';}
  return {value:Math.round(hiC), label, cls};
}

function istHourString(offsetHours=0){
  const ms = Date.now() + (5.5+offsetHours)*60*60000;
  return new Date(ms).toISOString().slice(0,13)+':00';
}

function nearestHourIndex(timeArr, targetStr){
  if(!timeArr) return -1;
  let idx = timeArr.indexOf(targetStr);
  if(idx !== -1) return idx;
  const t = new Date(targetStr).getTime();
  let best=0, bestDiff=Infinity;
  timeArr.forEach((s,i)=>{ const d=Math.abs(new Date(s).getTime()-t); if(d<bestDiff){bestDiff=d;best=i;} });
  return best;
}

function fmtHM(iso){
  if(!iso) return '—';
  try {
    const d = new Date(iso);
    return d.toLocaleTimeString(LANGUAGES[currentLangCode]?.code || 'en-IN', {
      hour: 'numeric', minute: '2-digit', hour12: true
    });
  } catch(e){
    return iso.slice(11,16);
  }
}

/* ---------- Data Fetching ---------- */
async function fetchJSON(url){
  const res = await fetch(url);
  if(!res.ok) throw new Error('HTTP '+res.status);
  return res.json();
}

async function loadCity(city){
  live = { weather:null, air:null, marine:null, london:live.london, error:null };
  heroExpanded = false;
  expandedDay = null;
  renderSourceLine('loading');
  renderHero(true);
  setSplashProgress(0.08, `${t('findingCity')} (${city.name})`);

  const wUrl = `https://api.open-meteo.com/v1/forecast?latitude=${city.lat}&longitude=${city.lon}`
    + `&current=temperature_2m,apparent_temperature,relative_humidity_2m,weather_code,wind_speed_10m,wind_gusts_10m,surface_pressure,dew_point_2m,cloud_cover`
    + `&daily=sunrise,sunset,uv_index_max,precipitation_probability_max,temperature_2m_min,temperature_2m_max,weather_code`
    + `&hourly=soil_moisture_0_to_1cm,visibility,precipitation_probability,temperature_2m,weather_code,relative_humidity_2m,wind_speed_10m,apparent_temperature`
    + `&minutely_15=precipitation`
    + `&forecast_days=7&timezone=Asia%2FKolkata`;
  const aUrl = `https://air-quality-api.open-meteo.com/v1/air-quality?latitude=${city.lat}&longitude=${city.lon}`
    + `&current=pm2_5,pm10,us_aqi&timezone=Asia%2FKolkata`;
  const mUrl = `https://marine-api.open-meteo.com/v1/marine?latitude=${city.lat}&longitude=${city.lon}`
    + `&current=wave_height,wave_period,sea_surface_temperature&timezone=Asia%2FKolkata`;
  const lUrl = `https://api.open-meteo.com/v1/forecast?latitude=${LONDON.lat}&longitude=${LONDON.lon}`
    + `&daily=precipitation_probability_max,temperature_2m_max&timezone=Europe%2FLondon`;

  await fetchJSON(wUrl).then(d=>live.weather=d).catch(e=>live.error='weather');
  setSplashProgress(0.42, t('readingSky'));

  await fetchJSON(aUrl).then(d=>live.air=d).catch(e=>live.error='air');
  setSplashProgress(0.72, t('checkingAir'));

  const extra = [];
  if(city.coastal) extra.push(fetchJSON(mUrl).then(d=>live.marine=d).catch(()=>{}));
  if(!live.london) extra.push(fetchJSON(lUrl).then(d=>live.london=d).catch(()=>{}));
  if(extra.length) await Promise.all(extra);

  setSplashProgress(1, t('ready'));
  renderHero(false);
  lastPollAt = Date.now();
  renderSourceLine(live.weather ? 'ok' : 'err');
  renderAlert();
  renderDynamic();
  renderHourly();
  renderDaily();
}

function setSplashProgress(pct, label){
  const bar = document.getElementById('splashBar');
  const lbl = document.getElementById('splashLabel');
  const sun = document.getElementById('sunWrap');
  const skyB = document.getElementById('skyB');
  if(bar) bar.style.width = (pct*100)+'%';
  if(sun) sun.style.top = (62 - pct*40)+'%';
  if(skyB) skyB.style.opacity = Math.max(0, (pct-0.45)/0.55);
  if(lbl && lbl.textContent !== label){
    lbl.style.opacity = 0;
    setTimeout(()=>{ lbl.textContent = label; lbl.style.opacity = 1; }, 160);
  }
}

function renderSourceLine(state){

}

/* ---------- hourly strip + minute-level rain nowcast ---------- */
function istMinuteString(offsetMinutes=0){
  const ms = Date.now() + (5.5*60+offsetMinutes)*60000;
  return new Date(ms).toISOString().slice(0,16);
}

function fmtHourShort(iso){
  try{
    const d = new Date(iso);
    return d.toLocaleTimeString(LANGUAGES[currentLangCode]?.code || 'en-IN', { hour:'numeric' });
  }catch(e){ return iso.slice(11,13); }
}

function renderNowcastBar(){
  const w = live.weather;
  const m = w?.minutely_15;
  if(!m || !m.time || !m.precipitation) return '';
  const startIdx = nearestHourIndex(m.time, istMinuteString(0));
  if(startIdx < 0) return '';
  const buckets = [];
  for(let i=0;i<8;i++){
    const idx = startIdx+i;
    if(idx >= m.time.length) break;
    buckets.push(m.precipitation[idx] ?? 0);
  }
  if(!buckets.length) return '';
  const max = Math.max(1, ...buckets);
  const anyRain = buckets.some(v=>v>0.05);
  let summary;
  if(!anyRain){
    summary = t('labels.noRainSoon');
  } else {
    const firstRainIdx = buckets.findIndex(v=>v>0.05);
    if(firstRainIdx===0) summary = t('labels.rainNow');
    else summary = t('labels.rainStartingIn').replace('{m}', firstRainIdx*15);
  }
  const bars = buckets.map(v=>{
    const h = Math.max(3, Math.round((v/max)*28));
    return `<div class="nc-bar" style="height:${h}px"></div>`;
  }).join('');
  return `<div class="nowcast">
    <p class="nc-summary"><i class="ti ti-cloud-rain"></i> ${summary}</p>
    <div class="nc-bars">${bars}</div>
  </div>`;
}

function renderHourly(){
  const zone = document.getElementById('hourlySection');
  if(!zone) return;
  const w = live.weather;
  if(!w || !w.hourly){ zone.innerHTML=''; return; }
  const nowIdx = nearestHourIndex(w.hourly.time, istHourString(0));
  if(nowIdx < 0){ zone.innerHTML=''; return; }
  const cards = [];
  for(let i=0;i<24;i++){
    const idx = nowIdx+i;
    if(idx >= w.hourly.time.length) break;
    const [icon] = weatherInfo(w.hourly.weather_code?.[idx]);
    const temp = Math.round(w.hourly.temperature_2m[idx]);
    const pop = w.hourly.precipitation_probability?.[idx] ?? 0;
    const timeLabel = i===0 ? t('labels.now') : fmtHourShort(w.hourly.time[idx]);
    cards.push(`<div class="hour-card" onclick="openHourDetail(${idx})">
      <p class="hc-time">${timeLabel}</p>
      <i class="ti ${icon} hc-icon"></i>
      <p class="hc-temp">${temp}°</p>
      <p class="hc-pop ${pop>=30?'hc-pop-on':''}">${pop>0?pop+'%':''}</p>
    </div>`);
  }
  zone.innerHTML = `<p class="section-label">${t('sections.hourly')}</p>
    ${renderNowcastBar()}
    <div class="hourly-strip">${cards.join('')}</div>`;
}

/* ---------- City picker (search any city/town/village in India) ---------- */
let citySearchState = { query:'', results:[] };
let citySearchTimer = null;

function openCityPicker(){
  citySearchState = { query:'', results:[] };
  const sheet = document.getElementById('sheet');
  sheet.classList.add('left-align');
  sheet.innerHTML = `
    <div class="sheet-handle"></div>
    <p class="city-picker-title">${t('changeLocation') || 'Change location'}</p>
    <div class="city-search-row">
      <i class="ti ti-search"></i>
      <input type="text" id="cityPickerInput" placeholder="${t('citySearchPlaceholder') || 'Search any city, town or village in India'}" oninput="onCityPickerInput(event)" autocomplete="off">
    </div>
    <div class="city-results" id="cityPickerResults"></div>
    <p class="city-picker-sublabel">${t('popularCities') || 'Popular cities'}</p>
    <div class="popular-city-grid" id="popularCityGrid"></div>`;
  renderPopularCityGrid();
  document.getElementById('sheetOverlay').classList.add('open');
  setTimeout(()=> document.getElementById('cityPickerInput')?.focus(), 260);
}

function renderPopularCityGrid(){
  const grid = document.getElementById('popularCityGrid');
  if(!grid) return;
  grid.innerHTML = CITIES.map(c => `
    <div class="popular-city-chip${currentCity.id===c.id ? ' current' : ''}" onclick="selectPopularCity('${c.id}')">${c.name}</div>
  `).join('');
}

function selectPopularCity(id){
  const c = CITIES.find(c=>c.id===id);
  if(!c) return;
  selectCity(c);
  closeSheet();
}

function onCityPickerInput(e){
  const q = e.target.value;
  citySearchState.query = q;
  clearTimeout(citySearchTimer);
  const resultsEl = document.getElementById('cityPickerResults');
  if(q.trim().length < 2){
    citySearchState.results = [];
    if(resultsEl) resultsEl.innerHTML = '';
    return;
  }
  citySearchTimer = setTimeout(()=>searchCities(q), 350);
}

async function searchCities(q){
  const resultsEl = document.getElementById('cityPickerResults');
  if(resultsEl) resultsEl.innerHTML = `<div class="city-result-loading">${t('searching')}</div>`;
  try{
    const apiL = LANGUAGES[currentLangCode]?.apiLang || 'en';
    // Open-Meteo's geocoding index covers India's cities, towns and villages (GeoNames-based),
    // not just a fixed shortlist — so any place name in the country can be found here.
    const url = `https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(q)}&count=10&language=${apiL}&format=json&countryCode=IN`;
    const d = await fetchJSON(url);
    citySearchState.results = d.results || [];
  }catch(e){
    citySearchState.results = [];
  }
  renderCitySearchResults();
}

function renderCitySearchResults(){
  const resultsEl = document.getElementById('cityPickerResults');
  if(!resultsEl) return;
  if(!citySearchState.results.length){
    resultsEl.innerHTML = citySearchState.query.trim().length >= 2
      ? `<div class="city-result-loading">${t('noMatch')}</div>` : '';
    return;
  }
  resultsEl.innerHTML = citySearchState.results.map((r,i)=>`
    <div class="city-result" onclick="pickSearchedCity(${i})">
      <i class="ti ti-map-pin"></i>
      <div><p class="cr-name">${r.name}</p><p class="cr-sub">${[r.admin2, r.admin1].filter(Boolean).join(', ') || 'India'}</p></div>
    </div>`).join('');
}

function pickSearchedCity(i){
  const r = citySearchState.results[i];
  if(!r) return;
  const city = {
    id:'custom-' + r.id,
    name:r.name,
    state:r.admin1 || '',
    lat:r.latitude,
    lon:r.longitude,
    coastal:false,
    tz:'Asia/Kolkata'
  };
  selectCity(city);
  closeSheet();
}

function selectCity(city){
  currentCity = city;
  try{ localStorage.setItem('mausam_city', JSON.stringify(city)); }catch(e){}
  const label = document.getElementById('citySelectLabel');
  if(label) label.textContent = city.name;
  loadCity(currentCity);
  syncFarmDefault(currentCity);
}

/* ---------- 7-day forecast ---------- */
let expandedDay = null;
function renderDaily(){
  const zone = document.getElementById('dailySection');
  if(!zone) return;
  const w = live.weather;
  if(!w || !w.daily){ zone.innerHTML=''; return; }
  const days = w.daily.time.length;
  const rows = [];
  for(let i=0;i<days;i++){
    const [icon, text] = weatherInfo(w.daily.weather_code?.[i]);
    const max = Math.round(w.daily.temperature_2m_max[i]);
    const min = Math.round(w.daily.temperature_2m_min[i]);
    const pop = w.daily.precipitation_probability_max?.[i] ?? 0;
    let dayLabel;
    if(i===0) dayLabel = t('labels.today');
    else {
      try{ dayLabel = new Date(w.daily.time[i]).toLocaleDateString(LANGUAGES[currentLangCode]?.code || 'en-IN', {weekday:'short'}); }
      catch(e){ dayLabel = w.daily.time[i].slice(5); }
    }
    const isOpen = expandedDay===i;
    rows.push(`<div class="day-row ${isOpen?'open':''}">
      <div class="day-row-main" onclick="toggleDay(${i})">
        <p class="dr-day">${dayLabel}</p>
        <i class="ti ${icon} dr-icon"></i>
        <p class="dr-pop">${pop>0?pop+'%':''}</p>
        <p class="dr-temp"><span class="dr-max">${max}°</span><span class="dr-min">${min}°</span></p>
        <i class="ti ti-chevron-down dr-chev"></i>
      </div>
      <div class="day-row-detail">
        <div class="dr-detail-grid">
          <div><i class="ti ti-cloud"></i><p class="sg-value">${text}</p></div>
          <div><i class="ti ti-sunrise"></i><p class="sg-value">${fmtHM(w.daily.sunrise[i])}</p></div>
          <div><i class="ti ti-sunset"></i><p class="sg-value">${fmtHM(w.daily.sunset[i])}</p></div>
          <div><i class="ti ti-sun"></i><p class="sg-value">UV ${w.daily.uv_index_max?.[i]!=null?w.daily.uv_index_max[i].toFixed(0):'—'}</p></div>
        </div>
      </div>
    </div>`);
  }
  zone.innerHTML = `<p class="section-label">${t('sections.daily')}</p><div class="daily-list">${rows.join('')}</div>`;
}
function toggleDay(i){
  expandedDay = expandedDay===i ? null : i;
  renderDaily();
}

function renderAlert(){
  const slot = document.getElementById('alertSlot');
  const w = live.weather;
  if(!w){ slot.innerHTML=''; return; }
  const maxT = w.daily.temperature_2m_max[0];
  const rainProb = w.daily.precipitation_probability_max[0];
  const uv = w.daily.uv_index_max[0];
  let msg = null;
  if(maxT >= 38) {
    msg = { icon:'ti-temperature-sun', text:`${Math.round(maxT)}°C — ${t('comfort.vHot')}` };
  } else if(rainProb >= 70) {
    msg = { icon:'ti-cloud-rain', text:`${rainProb}% ${t('labels.rainChanceToday')}` };
  } else if(uv >= 9) {
    msg = { icon:'ti-sun', text:`UV ${Math.round(uv)} — ${t('uv.vHigh')}` };
  }
  slot.innerHTML = msg ? `<div class="alert"><i class="ti ${msg.icon}"></i><span>${msg.text}</span></div>` : '';
}

/* ---------- Farm Search & Soil ---------- */
let farmSearchTimer = null;

function onFarmSearchInput(e){
  const q = e.target.value;
  farmState.query = q;
  clearTimeout(farmSearchTimer);
  const resultsEl = document.getElementById('farmResults');
  if(q.trim().length < 2){
    farmState.results = [];
    if(resultsEl) resultsEl.innerHTML = '';
    return;
  }
  farmSearchTimer = setTimeout(()=>searchVillages(q), 400);
}

async function searchVillages(q){
  const resultsEl = document.getElementById('farmResults');
  if(resultsEl) resultsEl.innerHTML = `<div class="farm-result-loading">${t('searching')}</div>`;
  try{
    const apiL = LANGUAGES[currentLangCode]?.apiLang || 'en';
    const url = `https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(q)}&count=6&language=${apiL}&format=json&countryCode=IN`;
    const d = await fetchJSON(url);
    farmState.results = d.results || [];
  }catch(e){
    farmState.results = [];
  }
  renderFarmResults();
}

function renderFarmResults(){
  const resultsEl = document.getElementById('farmResults');
  if(!resultsEl) return;
  if(!farmState.results.length){
    resultsEl.innerHTML = farmState.query.trim().length >= 2
      ? `<div class="farm-result-loading">${t('noMatch')}</div>` : '';
    return;
  }
  resultsEl.innerHTML = farmState.results.map((r,i)=>`
    <div class="farm-result" onclick="pickVillage(${i})">
      <p class="fr-name">${r.name}</p>
      <p class="fr-sub">${[r.admin2, r.admin1, r.country].filter(Boolean).join(', ')}</p>
    </div>`).join('');
}

function pickVillage(i){
  const r = farmState.results[i];
  if(!r) return;
  farmState.results = [];
  farmState.query = '';
  loadFarmSoil({ name:r.name, admin1:r.admin1, lat:r.latitude, lon:r.longitude, isCustom:true });
}

async function loadFarmSoil(loc){
  farmState.location = loc;
  farmState.soil = null;
  farmState.error = null;
  renderDynamic();
  const url = `https://api.open-meteo.com/v1/forecast?latitude=${loc.lat}&longitude=${loc.lon}`
    + `&daily=precipitation_sum,temperature_2m_min,temperature_2m_max`
    + `&hourly=soil_moisture_0_to_1cm,soil_moisture_3_to_9cm,soil_moisture_9_to_27cm,soil_temperature_6cm,et0_fao_evapotranspiration`
    + `&forecast_days=7&timezone=Asia%2FKolkata`;
  try{
    farmState.soil = await fetchJSON(url);
  }catch(e){
    farmState.error = 'soil';
  }
  renderDynamic();
}

function syncFarmDefault(city){
  if(farmState.location && farmState.location.isCustom) return;
  loadFarmSoil({ name:city.name, state:city.state, lat:city.lat, lon:city.lon, isCustom:false });
}

/* Polling */
function startPolling(){
  stopPolling();
  weatherPollId = setInterval(()=> loadCity(currentCity), POLL_MS);
  farmPollId = setInterval(()=>{ if(farmState.location) loadFarmSoil(farmState.location); }, FARM_POLL_MS);
}
function stopPolling(){
  if(weatherPollId) clearInterval(weatherPollId);
  if(farmPollId) clearInterval(farmPollId);
  weatherPollId = farmPollId = null;
}
document.addEventListener('visibilitychange', ()=>{
  if(document.hidden){
    stopPolling();
  } else {
    if(Date.now() - lastPollAt > POLL_MS){
      loadCity(currentCity);
      if(farmState.location) loadFarmSoil(farmState.location);
    }
    startPolling();
  }
});

/* ---------- Card Renderers with Translations ---------- */
function cardFitness(){
  const w = live.weather;
  if(!w) return `<div class="err-note">${t('conditionsFail')}</div>`;
  const sunrise = w.daily.sunrise[0];
  const [sh, sm] = sunrise.slice(11,16).split(':').map(Number);
  let endH = sh + 1, endM = sm;
  if(endH > 23) endH -= 24;
  const endStr = `${String(endH).padStart(2,'0')}:${String(endM).padStart(2,'0')}`;
  const windNow = Math.round(w.current.wind_speed_10m);
  return `<div class="pair">
    <div class="stat-tile"><i class="ti ti-clock-hour-4"></i><p class="st-label">${t('labels.bestWindow')}</p><p class="st-value">${fmtHM(sunrise)}–${fmtHM(sunrise.slice(0,11)+endStr)}</p></div>
    <div class="stat-tile"><i class="ti ti-wind"></i><p class="st-label">${t('labels.windNow')}</p><p class="st-value">${windNow} km/h</p></div>
  </div>`;
}

function cardHealth(){
  const a = live.air, w = live.weather;
  if(!a || !w) return `<div class="err-note">${t('conditionsFail')}</div>`;
  const aqi = a.current.us_aqi;
  const aqiCat = aqiCategory(aqi);
  const uv = w.daily.uv_index_max[0];
  const uvCat = uvCategory(uv);
  return `<div class="triple">
    <div class="mini-tile"><p class="mt-label">US AQI</p><p class="mt-value ${aqiCat.cls}">${aqi ?? '—'}</p></div>
    <div class="mini-tile"><p class="mt-label">PM2.5</p><p class="mt-value">${a.current.pm2_5?.toFixed(0) ?? '—'} µg/m³</p></div>
    <div class="mini-tile"><p class="mt-label">${t('labels.uvIndex')}</p><p class="mt-value ${uvCat.cls}">${uv?.toFixed(0) ?? '—'} · ${uvCat.text}</p></div>
  </div>`;
}

function cardBeach(){
  if(!currentCity.coastal) return `<div class="empty-note">${t('labels.notCoastal').replace('{city}', currentCity.name)}</div>`;
  const m = live.marine;
  if(!m) return `<div class="err-note">${t('conditionsFail')}</div>`;
  return `<div class="stack">
    <div class="row-card"><i class="ti ti-wave-saw-tool lead"></i><div><p class="rc-title">${t('labels.waveHeight')}</p><p class="rc-sub">${t('labels.wavePeriod')} ${m.current.wave_period?.toFixed(1) ?? '—'}s</p></div><div class="rc-value">${m.current.wave_height?.toFixed(1) ?? '—'}m</div></div>
    <div class="row-card"><i class="ti ti-thermometer lead"></i><div><p class="rc-title">${t('labels.seaTemp')}</p><p class="rc-sub">${currentCity.name}</p></div><div class="rc-value">${m.current.sea_surface_temperature?.toFixed(1) ?? '—'}°C</div></div>
  </div>`;
}

function cardTravel(){
  const l = live.london;
  let tip = '...';
  if(l){
    const rp = l.daily.precipitation_probability_max[0];
    const mx = Math.round(l.daily.temperature_2m_max[0]);
    tip = `${rp}% · ${mx}°C`;
  }
  return `<div class="stack">
    <div class="row-card"><i class="ti ti-plane lead"></i><div><p class="rc-title">London</p><p class="rc-sub">${tip}</p></div></div>
  </div>`;
}

function cardFamily(){
  const w = live.weather;
  if(!w) return `<div class="err-note">${t('conditionsFail')}</div>`;
  const idx = nearestHourIndex(w.hourly.time, istHourString(0).slice(0,11)+'15:00');
  const rp = w.hourly.precipitation_probability?.[idx];
  const msg = rp!=null && rp>=40 ? `${t('weather.63')} (${rp}%)` : `${t('weather.0')}`;
  return `<div class="row-card"><i class="ti ti-bus lead"></i><div><p class="rc-title">${msg}</p><p class="rc-sub">15:00 IST</p></div></div>`;
}

function cardGarden(){
  let html = `<div class="farm-search-wrap">
    <div class="farm-search-row">
      <i class="ti ti-search"></i>
      <input id="villageInput" type="text" placeholder="${t('searchVillagePlaceholder')}" value="${farmState.query.replace(/"/g,'&quot;')}" oninput="onFarmSearchInput(event)">
    </div>
    <div class="farm-results" id="farmResults"></div>
  </div>`;

  const loc = farmState.location;
  if(farmState.error === 'soil'){
    html += `<div class="err-note">${t('conditionsFail')}</div>`;
    return html;
  }
  if(!loc || !farmState.soil){
    html += `<div class="load-note">${t('loadingConditions')}</div>`;
    return html;
  }

  const s = farmState.soil;
  const idx = nearestHourIndex(s.hourly.time, istHourString(0));
  const surface = s.hourly.soil_moisture_0_to_1cm?.[idx];
  const root = s.hourly.soil_moisture_3_to_9cm?.[idx];
  const deep = s.hourly.soil_moisture_9_to_27cm?.[idx];
  const soilTemp = s.hourly.soil_temperature_6cm?.[idx];
  const minT = Math.min(...s.daily.temperature_2m_min);
  const frost = minT <= 2;
  const rain7 = s.daily.precipitation_sum.reduce((a,b)=>a+(b||0),0);

  const todayStr = istHourString(0).slice(0,10);
  let et0Today = 0;
  s.hourly.time.forEach((tStr,i)=>{ if(tStr.startsWith(todayStr) && s.hourly.et0_fao_evapotranspiration?.[i]!=null) et0Today += s.hourly.et0_fao_evapotranspiration[i]; });
  const rainToday = s.daily.precipitation_sum[0] ?? 0;
  const needsIrrigation = et0Today > (rainToday + 1);

  const mLabel = v => v==null ? '—' : v<0.15 ? t('soilMoisture.dry') : v<0.30 ? t('soilMoisture.adequate') : t('soilMoisture.wet');
  const mCls = v => v==null ? '' : v<0.15 ? 'mt-warn' : v<0.30 ? 'mt-good' : 'mt-warn';

  html += `<p class="farm-location-line"><i class="ti ti-map-pin-filled"></i> ${
    loc.isCustom
      ? `${loc.name}${loc.admin1 ? ', '+loc.admin1 : ''}`
      : `${loc.name}${loc.state ? ', '+loc.state : ''}`
  }</p>`;

  html += `<div class="triple">
    <div class="mini-tile"><p class="mt-label">${t('labels.surface')}</p><p class="mt-value ${mCls(surface)}">${mLabel(surface)}</p></div>
    <div class="mini-tile"><p class="mt-label">${t('labels.rootZone')}</p><p class="mt-value ${mCls(root)}">${mLabel(root)}</p></div>
    <div class="mini-tile"><p class="mt-label">${t('labels.deepSoil')}</p><p class="mt-value ${mCls(deep)}">${mLabel(deep)}</p></div>
  </div>

  <div class="stack" style="margin-top:9px;">
    <div class="row-card"><i class="ti ti-thermometer lead"></i><div><p class="rc-title">${t('labels.soilTemp')}</p><p class="rc-sub">6cm</p></div><div class="rc-value">${soilTemp!=null ? soilTemp.toFixed(1)+'°C' : '—'}</div></div>
    <div class="row-card"><i class="ti ti-droplet-up lead"></i><div><p class="rc-title">${needsIrrigation ? t('labels.irrigationYes') : t('labels.irrigationNo')}</p><p class="rc-sub">${et0Today.toFixed(1)}mm / ${rainToday.toFixed(1)}mm</p></div></div>
    <div class="row-card"><i class="ti ti-cloud-rain lead"></i><div><p class="rc-title">${t('labels.rain7Days')}</p></div><div class="rc-value">${rain7.toFixed(0)}mm</div></div>
    <div class="row-card"><i class="ti ti-snowflake lead"></i><div><p class="rc-title">${t('labels.frostRisk')}</p><p class="rc-sub">Min: ${minT.toFixed(0)}°C</p></div><div class="rc-value">${frost ? t('labels.atRisk') : t('labels.none')}</div></div>
  </div>
  <p style="font-size:11px;color:var(--ink-mute);margin:10px 2px 0;">${t('labels.soilCardNote')}</p>`;

  return html;
}

function cardCommute(){
  const w = live.weather;
  if(!w) return `<div class="err-note">${t('conditionsFail')}</div>`;
  const idx = nearestHourIndex(w.hourly.time, istHourString(0));
  const vis = w.hourly.visibility?.[idx];
  const visKm = vis!=null ? (vis/1000).toFixed(1) : null;
  const foggy = vis!=null && vis < 1000;
  return `<div class="row-card"><i class="ti ti-car lead"></i><div><p class="rc-title">${foggy ? t('labels.visibilityReduced') : t('labels.visibilityGood')}</p><p class="rc-sub">${t('labels.currRoadVis')}</p></div><div class="rc-value">${visKm ? visKm+' km' : '—'}</div></div>`;
}

function cardEvents(){
  const w = live.weather;
  if(!w) return `<div class="err-note">${t('conditionsFail')}</div>`;
  const rp = w.daily.precipitation_probability_max[0];
  const ci = comfortIndex(w.current.temperature_2m, w.current.relative_humidity_2m);
  return `<div class="pair">
    <div class="stat-tile"><i class="ti ti-umbrella"></i><p class="st-label">${t('labels.rainChanceToday')}</p><p class="st-value">${rp}%</p></div>
    <div class="stat-tile"><i class="ti ti-mood-smile"></i><p class="st-label">${t('labels.comfortIndex')}</p><p class="st-value ${ci?.cls ?? ''}">${ci ? ci.label : '—'}</p></div>
  </div>`;
}

const CARD_DEFS = [
  { tag:'fitness', render:cardFitness },
  { tag:'health', render:cardHealth },
  { tag:'beach', render:cardBeach },
  { tag:'travel', sample:true, render:cardTravel },
  { tag:'family', render:cardFamily },
  { tag:'garden', render:cardGarden },
  { tag:'commute', render:cardCommute },
  { tag:'events', render:cardEvents },
];

function sectionBlock(def){
  const title = t(`sections.${def.tag}`) || def.tag;
  const tag = def.sample ? `<span class="tag-sample">${t('sampleData')}</span>` : '';
  return `<div class="section"><p class="section-label">${title}${tag}</p>${def.render()}</div>`;
}

function renderDynamic(){
  const zone = document.getElementById('dynamic');
  zone.classList.add('fading');
  setTimeout(()=>{
    const chosen = CARD_DEFS.filter(c => active.has(c.tag));
    const rest = CARD_DEFS.filter(c => !active.has(c.tag)).slice(0,3);
    let html = '';
    if(chosen.length === 0){
      html += `<div class="empty-note">${t('emptyHome')}</div>`;
    } else {
      chosen.forEach(c=>{ html += sectionBlock(c); });
    }
    if(rest.length){
      const discCards = rest.map(c => `<div class="disc-card"><i class="ti ti-sparkles"></i><p>${t(`sections.${c.tag}`)}</p></div>`).join('');
      html += `<div class="section"><p class="section-label">${t('discover')}</p><div class="discover-strip">${discCards}</div></div>`;
    }
    zone.innerHTML = html;
    requestAnimationFrame(()=> zone.classList.remove('fading'));
  }, 160);
}

function renderChips(){
  const chipRow = document.getElementById('chiprow');
  chipRow.innerHTML = '';
  personaIds.forEach(id=>{
    const el = document.createElement('div');
    el.className = 'chip' + (active.has(id) ? ' on' : '');
    el.textContent = t(`categories.${id}`) || id;
    el.addEventListener('click', ()=>{
      const wasOn = active.has(id);
      active.clear();
      if(!wasOn) active.add(id);
      renderChips();
      renderDynamic();
    });
    chipRow.appendChild(el);
  });
}

function loadSavedName(){
  try{
    const n = localStorage.getItem('mausam_name');
    if(n && n.trim()) return n.trim();
  }catch(e){}
  return 'Aditi';
}
let userName = loadSavedName();

function updateGreeting(){
  const hour = new Date().getHours();
  const timeKey = hour < 12 ? 'morning' : hour < 17 ? 'afternoon' : 'evening';
  const greetWord = t(`greetings.${timeKey}`);
  document.getElementById('greeting').textContent = `${greetWord}, ${userName}`;
  document.getElementById('avatarLetter').textContent = userName.trim().charAt(0).toUpperCase() || 'A';
  document.getElementById('splashWord').textContent = t('appTitle');
  document.getElementById('splashTag').textContent = t('appTag');
}

function openNamePicker(){
  const sheet = document.getElementById('sheet');
  sheet.classList.add('left-align');
  sheet.innerHTML = `
    <div class="sheet-handle"></div>
    <p class="city-picker-title">${t('editNameTitle') || 'Your name'}</p>
    <div class="sheet-input-row">
      <i class="ti ti-user"></i>
      <input type="text" id="namePickerInput" placeholder="${t('namePlaceholder') || 'Enter your name'}" value="${userName.replace(/"/g,'&quot;')}" autocomplete="off" maxlength="24">
    </div>
    <button class="sheet-primary-btn" id="nameSaveBtn" onclick="submitNameEdit()">${t('save') || 'Save'}</button>`;
  document.getElementById('sheetOverlay').classList.add('open');
  const input = document.getElementById('namePickerInput');
  setTimeout(()=>{ input?.focus(); input?.select(); }, 260);
  input?.addEventListener('keydown', (e)=>{ if(e.key === 'Enter') submitNameEdit(); });
}

function submitNameEdit(){
  const input = document.getElementById('namePickerInput');
  if(!input) return;
  const val = input.value.trim();
  if(!val) return;
  userName = val.slice(0, 24);
  try{ localStorage.setItem('mausam_name', userName); }catch(e){}
  updateGreeting();
  closeSheet();
}

function setLanguage(langCode){
  if(!LANGUAGES[langCode]) return;
  currentLangCode = langCode;
  localStorage.setItem('mausam_lang', langCode);
  document.documentElement.lang = langCode;

  updateGreeting();
  renderChips();
  renderHero(false);
  renderSourceLine(live.weather ? 'ok' : 'err');
  renderAlert();
  renderDynamic();
}

/* ---------- Setup UI Selectors ---------- */
const langSelect = document.getElementById('langSelect');
Object.keys(LANGUAGES).forEach(k => {
  const opt = document.createElement('option');
  opt.value = k;
  opt.textContent = `${LANGUAGES[k].native} (${LANGUAGES[k].name})`;
  if(k === currentLangCode) opt.selected = true;
  langSelect.appendChild(opt);
});
langSelect.addEventListener('change', (e) => setLanguage(e.target.value));

document.getElementById('citySelectLabel').textContent = currentCity.name;

/* Init */
updateGreeting();
renderChips();
tickClock();

const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
const minSplash = new Promise(res => setTimeout(res, reduceMotion ? 0 : 1100));
const firstLoad = loadCity(currentCity);
syncFarmDefault(currentCity);
startPolling();

Promise.all([minSplash, firstLoad]).then(()=>{
  const reveal = ()=>{
    document.getElementById('splash').classList.add('leaving');
    setTimeout(()=> document.getElementById('scrollRoot').classList.add('in'), 180);
  };
  if(reduceMotion) reveal();
  else setTimeout(reveal, 260);
});
</script>
